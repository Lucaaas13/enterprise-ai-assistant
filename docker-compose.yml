services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise-ai-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MonPostgres2026
      POSTGRES_DB: enterprise_ai_assistant

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: