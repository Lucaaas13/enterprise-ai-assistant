services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise-ai-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MonPostgres2026
      POSTGRES_DB: enterprise_ai_assistant

    ports:  
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d enterprise_ai_assistant"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: enterprise-ai-api

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres:5432/enterprise_ai_assistant
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_MODEL: qwen2.5:3b

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: